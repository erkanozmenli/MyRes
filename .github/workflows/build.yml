name: Build and Push Images

on:
  push:
    branches:
      - dev
      - master

jobs:
  detect-changes:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      hasChanges: ${{ steps.matrix.outputs.hasChanges }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate Matrix
        id: matrix
        run: |
          node .github/scripts/generate-matrix.js >> $GITHUB_OUTPUT


  build-and-push:
    needs: detect-changes

    if: needs.detect-changes.outputs.hasChanges == 'true'

    runs-on: ubuntu-latest

    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.11
        with:
          versionSpec: "6.0.5"


      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.1.11


      - name: Set version variables
        id: vars
        run: |
          echo "semver=${{ steps.gitversion.outputs.semVer }}" >> $GITHUB_OUTPUT
          echo "sha=sha-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "is_dev=true" >> $GITHUB_OUTPUT

          elif [[ "${GITHUB_REF_NAME}" == "master" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "is_dev=false" >> $GITHUB_OUTPUT

          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1
          fi


      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"


      - name: Restore
        run: dotnet restore


      - name: Run TripService Domain Unit Tests
        run: >
          dotnet test
          tests/TripService/Domain/MyRes.TripService.Domain.UnitTests/MyRes.TripService.Domain.UnitTests.csproj
          --configuration Release
          --no-restore


      - name: Run TripService Application Unit Tests
        run: >
          dotnet test
          tests/TripService/Application/MyRes.TripService.Application.UnitTests/MyRes.TripService.Application.UnitTests.csproj
          --configuration Release
          --no-restore

      - name: Run TripService Architecture Tests
        run: >
          dotnet test
          tests/TripService/Architecture/MyRes.TripService.ArchitectureTests/MyRes.TripService.ArchitectureTests.csproj
          --configuration Release
          --no-restore

      - name: Run Services Architecture Tests
        run: >
          dotnet test
          tests/Architecture/MyRes.ArchitectureTests/MyRes.ArchitectureTests.csproj
          --configuration Release
          --no-restore


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}


      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.name }}:${{ steps.vars.outputs.sha }}
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.name }}:${{ steps.vars.outputs.semver }}
            ${{ steps.vars.outputs.is_dev == 'true' && format('{0}/{1}:dev', secrets.DOCKER_USERNAME, matrix.name) || '' }}


      - name: Install yq
        uses: mikefarah/yq@v4.44.2


      - name: Checkout GitOps
        uses: actions/checkout@v4
        with:
          repository: erkanozmenli/MyRes-GitOps
          token: ${{ secrets.MYRES_GITOPS_PAT }}
          path: gitops


      - name: Update image tag
        run: |

          MANIFEST_PATH="gitops/gitops-v2/environments/${{ steps.vars.outputs.environment }}/${{ matrix.patch }}"

          echo "Updating: $MANIFEST_PATH"

          yq -i '
            .spec.template.spec.containers[0].image =
            "${{ secrets.DOCKER_USERNAME }}/${{ matrix.name }}:${{ steps.vars.outputs.semver }}"
          ' $MANIFEST_PATH


      - name: Commit changes
        run: |
          cd gitops

          git config user.name "github-actions"
          git config user.email "7737955+erkanozmenli@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update ${{ matrix.name }} -> ${{ steps.vars.outputs.semver }}"

          git push