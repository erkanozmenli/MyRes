receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  otlphttp/grafana:
    endpoint: https://otlp-gateway-prod-gb-south-1.grafana.net/otlp
    headers:
      Authorization: "Basic AddYourGrafanaAuthorizationKeyHere"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/grafana]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/grafana]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/grafana]